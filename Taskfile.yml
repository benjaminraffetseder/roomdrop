version: '3'

vars:
  APP_NAME: "roomdrop"
  BIN_DIR: bin
  PACKAGE_MANAGER: npm
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: '{{.GOOS}}:build'

  package:
    summary: Packages the application
    cmds:
      - task: '{{.GOOS}}:package'

  release:updater:
    summary: Builds update assets and SHA256SUMS.txt in bin/release/v<version>
    cmds:
      - task: '{{if eq .GOOS "darwin"}}darwin:package:universal{{else}}{{.GOOS}}:build{{end}}'
      - node scripts/prepare-update.mjs "{{.GOOS}}" "{{.ARCH | default ARCH}}"

  run:
    summary: Runs the application
    cmds:
      - task: '{{.GOOS}}:run'

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
